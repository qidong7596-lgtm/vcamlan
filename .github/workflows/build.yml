name: build

# 背景：
#   1) 本账号的 macOS runner 不可用（job 创建即 cancelled，runner 从未分配），已用 probe workflow 实测：
#        on_ubuntu = success（runner 正常），on_macos = cancelled
#   2) Ubuntu runner 正常，所以改用 Linux 交叉编译 Mach-O dylib。
#   3) Theos 在 Linux 上需要 $THEOS/toolchain/linux/iphone/bin/clang（本环境不存在），
#      所以直接用 Zig 自带的 clang 驱动 + 内置 lld（支持 Mach-O 链接），配合 iOS SDK 的 .tbd 存根。
#   4) 签名跳过：TrollFools 注入不需要签名。

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build VCamLAN.dylib (linux + zig)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig (自带 clang + Mach-O lld)
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xf /tmp/zig.tar.xz -C /opt
          ln -sf /opt/zig-linux-x86_64-0.13.0/zig /usr/local/bin/zig
          zig version
          zig env | head -n 20

      - name: Install iOS SDK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/sdks.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          mkdir -p /tmp/sdks
          tar -xzf /tmp/sdks.tar.gz -C /tmp/sdks --strip-components=1
          pick=""
          for cand in iPhoneOS15.6.sdk iPhoneOS14.5.sdk iPhoneOS16.5.sdk iPhoneOS15.0.sdk iPhoneOS14.4.sdk; do
            if [ -d "/tmp/sdks/$cand" ]; then pick="/tmp/sdks/$cand"; break; fi
          done
          if [ -z "$pick" ]; then
            pick=$(ls -d /tmp/sdks/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$pick" ]; then echo "!! 没找到 SDK"; ls -la /tmp/sdks; exit 1; fi
          echo "SDK = $pick"
          echo "SDK=$pick" >> "$GITHUB_ENV"
          ls "$pick" | head -n 20

      - name: Build with Zig (arm64)
        run: |
          set -euo pipefail
          echo "=== SDK=$SDK ==="
          mkdir -p out
          CFLAGS=(
            -target aarch64-ios
            -isysroot "$SDK"
            -F"$SDK/System/Library/Frameworks"
            -L"$SDK/usr/lib"
            -I"$SDK/usr/include"
            -fobjc-arc
            -O2
            -DNDEBUG
            -I.
            -Wno-everything
            -fno-stack-protector
          )
          LIBS=(
            -framework Foundation
            -framework UIKit
            -framework AVFoundation
            -framework CoreMedia
            -framework CoreVideo
            -framework VideoToolbox
            -framework QuartzCore
            -framework CoreGraphics
          )
          set -x
          zig cc "${CFLAGS[@]}" -dynamiclib \
            -install_name @rpath/VCamLAN.dylib \
            -o VCamLAN.dylib \
            VCamLANMain.m VCamLANPrefs.m VCamLANHTTPFLVPuller.m \
            "${LIBS[@]}" 2>&1 | tee /tmp/build.log | tail -n 100
          set +x
          echo "=== exit=${PIPESTATUS[0]} ==="
          ls -la VCamLAN.dylib 2>/dev/null || (echo "!! 没有产物，完整日志见下"; cat /tmp/build.log; exit 1)

      - name: Inspect output
        run: |
          set -euo pipefail
          if [ ! -f VCamLAN.dylib ]; then echo "!! 没产出"; exit 1; fi
          file VCamLAN.dylib || true
          stat -c '%s bytes' VCamLAN.dylib
          python3 - <<'PY'
          import struct, sys
          d = open('VCamLAN.dylib','rb').read()
          print("magic:", d[:4].hex())
          if d[:4] == b'\xcf\xfa\xed\xfe':
              cpu, sub, ft, ncmds, sizeofcmds, flags = struct.unpack_from('<iiIIII', d, 4)
              print("cputype=0x%x cpusubtype=0x%x filetype=%d ncmds=%d flags=0x%x" % (cpu, sub, ft, ncmds, flags))
              if cpu != 0x100000c: print("!! cputype 不是 arm64")
              if ft != 6: print("!! filetype 不是 MH_DYLIB(6)")
              print("OK: 是 arm64 Mach-O dylib")
          else:
              print("!! 不是 Mach-O"); sys.exit(1)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamLAN.dylib
          path: VCamLAN.dylib
          if-no-files-found: error
          retention-days: 30
