name: build

# 背景（实测）：
#   * macOS runner 不可用（创建即 cancelled），ubuntu runner 正常
#   * Zig 的 lld 编多文件 ObjC 会丢类（classlist 只剩 2 个、类成 undef）→ dyld 崩
#   * 需要标准的 ld64.lld（LLVM Mach-O 链接器）
# 本文件对 ld64.lld 做多重探测 + 详细打印，确保能定位到底缺什么

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build VCamLAN.dylib
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang + lld
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm python3 xz-utils
          echo "=== clang ==="; clang --version | head -n 3
          echo "=== /usr/lib/llvm-*/bin (只看 ld*) ==="
          for d in /usr/lib/llvm-*/bin; do [ -d "$d" ] && { echo "--- $d"; ls -la "$d" | grep -Ei '\bld|ld64|lld' || echo "(none)"; }; done
          echo "=== /usr/bin (ld*) ==="
          ls -la /usr/bin/ | grep -E ' ld|lld' || echo "(none)"

      - name: Locate or install ld64.lld
        run: |
          set -euo pipefail
          find_ld64() {
            for c in /usr/lib/llvm-*/bin/ld64.lld /usr/bin/ld64.lld /usr/local/bin/ld64.lld; do
              [ -x "$c" ] && { echo "$c"; return 0; }
            done
            return 1
          }
          LD64="$(find_ld64 || true)"
          CLANG="$(command -v clang)"
          if [ -n "$LD64" ]; then
            SAME_DIR="$(dirname "$LD64")/clang"
            if [ -x "$SAME_DIR" ]; then
              CLANG="$SAME_DIR"
              echo ">>> 用与 ld64.lld 同目录的 clang：$CLANG（版本匹配）"
            fi
          fi

          if [ -z "$LD64" ]; then
            echo ">>> apt 没有 ld64.lld，试着补装 lld-18 / lld-17"
            sudo apt-get install -y --no-install-recommends lld-18 lld-17 2>/dev/null || true
            LD64="$(find_ld64 || true)"
          fi

          if [ -z "$LD64" ]; then
            echo ">>> 仍然没有，下载 LLVM 官方预编译包"
            for URL in \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-16.0.6/clang+llvm-16.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz" ; do
              echo "--- try $URL"
              if curl -fL --retry 2 --connect-timeout 20 -o /tmp/llvm.tar.xz "$URL"; then
                echo "    downloaded $(stat -c %s /tmp/llvm.tar.xz) bytes"
                rm -rf /opt/llvm; mkdir -p /opt/llvm
                if tar -xf /tmp/llvm.tar.xz -C /opt/llvm --strip-components=1; then
                  echo "    extracted. bin 里有哪些 ld*:"
                  ls -la /opt/llvm/bin/ | grep -Ei 'ld|lld' || echo "    (没有)"
                  if [ -x /opt/llvm/bin/ld64.lld ]; then
                    LD64=/opt/llvm/bin/ld64.lld
                    CLANG=/opt/llvm/bin/clang
                    break
                  fi
                else
                  echo "    tar 解压失败"
                fi
              else
                echo "    下载失败"
              fi
            done
          fi

          if [ -z "$LD64" ]; then
            echo "!! 所有途径都拿不到 ld64.lld"
            echo "== 全盘搜索（慢，仅失败时跑）=="
            find / -name 'ld64*' -o -name 'ld.lld*' 2>/dev/null | head -n 30 || true
            exit 1
          fi

          echo "LD64=$LD64" >> "$GITHUB_ENV"
          echo "CC1=$CLANG" >> "$GITHUB_ENV"
          echo ">>> 使用 LD64 = $LD64"
          echo ">>> 使用 CC   = $CLANG"
          "$CLANG" --version | head -n 2
          "$LD64" --version || true

      - name: Install iOS SDK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/sdks.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          mkdir -p /tmp/sdks
          tar -xzf /tmp/sdks.tar.gz -C /tmp/sdks --strip-components=1
          pick=""
          for cand in iPhoneOS15.6.sdk iPhoneOS14.5.sdk iPhoneOS16.5.sdk iPhoneOS15.0.sdk iPhoneOS14.4.sdk; do
            [ -d "/tmp/sdks/$cand" ] && { pick="/tmp/sdks/$cand"; break; }
          done
          if [ -z "$pick" ]; then pick=$(ls -d /tmp/sdks/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -n 1); fi
          [ -n "$pick" ] || { echo "no sdk"; ls -la /tmp/sdks; exit 1; }
          echo "SDK=$pick" >> "$GITHUB_ENV"
          echo "SDK = $pick"

      - name: Build
        run: |
          set -euo pipefail
          echo "CC1=$CC1  LD64=$LD64  SDK=$SDK"
          "$CC1" \
            -target arm64-apple-ios14.0 \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -L"$SDK/usr/lib" \
            -fobjc-arc -O2 -DNDEBUG -I. -fno-stack-protector \
            --ld-path="$LD64" \
            -Wl,-platform_version -Wl,ios -Wl,14.0 -Wl,15.6 \
            -dynamiclib -install_name @rpath/VCamLAN.dylib \
            -o VCamLAN.dylib \
            VCamLANMain.m VCamLANPrefs.m VCamLANHTTPFLVPuller.m \
            -framework Foundation -framework UIKit \
            -framework AVFoundation -framework CoreMedia \
            -framework CoreVideo -framework VideoToolbox \
            -framework QuartzCore -framework CoreGraphics 2>&1 | tail -n 60
          ls -la VCamLAN.dylib

      - name: STRICT self-check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, sys
          d = open('VCamLAN.dylib','rb').read()
          magic, cpu, sub, ft, ncmds, sizeofcmds, flags, _ = struct.unpack_from('<IiiIIIII', d, 0)
          print("magic=%08x cpu=%x filetype=%d ncmds=%d size=%d" % (magic, cpu & 0xffffffff, ft, ncmds, len(d)))
          assert magic == 0xfeedfacf and (cpu & 0xffffffff) == 0x0100000c and ft == 6
          off, symtab, dysym, classlist_size, dylibs = 32, None, None, None, []
          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from('<II', d, off)
              if cmd == 0x19:
                  nsec = struct.unpack_from('<I', d, off+64)[0]
                  soff = off + 72
                  for _s in range(nsec):
                      secname = d[soff:soff+16].rstrip(b'\x00').decode()
                      if secname == '__objc_classlist':
                          classlist_size = struct.unpack_from('<Q', d, soff+40)[0]
                      soff += 80
              elif cmd == 0x2: symtab = struct.unpack_from('<IIII', d, off+8)
              elif cmd == 0xb: dysym = struct.unpack_from('<IIIIIIIIIIIIIIIIIIII', d, off+8)
              elif cmd in (0xc, 0x1f, 0x8000001f):
                  no = struct.unpack_from('<I', d, off+8)[0]; end = d.index(b'\x00', off+no)
                  dylibs.append(d[off+no:end].decode('utf-8','replace'))
              off += cmdsize
          nclasses = (classlist_size or 0)//8
          print("__objc_classlist 条目 =", nclasses)
          symoff, nsyms, stroff, strsize = symtab
          print("nextdefsym=%d nundefsym=%d" % (dysym[3], dysym[4]))
          undef = []
          for i in range(nsyms):
              e = symoff + i*16
              strx, ntype, nsect, ndesc, nvalue = struct.unpack_from('<IBBhQ', d, e)
              if (ntype & 0x0e) == 0:
                  end = d.index(b'\x00', stroff+strx)
                  nm = d[stroff+strx:end].decode('utf-8','replace')
                  # 只把本工程自己定义的类算作错误；NS*/UI*/VT* 等系统类本来就该是 undef
                  if (nm.startswith('_OBJC_CLASS_$_') or nm.startswith('_OBJC_METACLASS_$_')) and 'VCamLAN' in nm:
                      undef.append(nm)
          print("未定义 ObjC 类 =", len(undef), undef[:8])
          for nm in dylibs:
              if 'substrate' in nm.lower(): print("!! substrate:", nm); sys.exit(1)
          assert not undef, "本工程自己的 ObjC 类成了未定义符号（链接器丢了 ObjC section）：%r" % undef
          assert nclasses >= 2, "classlist 只有 %d 个类（应为 2 个：VCamLANHTTPFLVPuller / VCamLANButtonTarget）" % nclasses
          print("PASS")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamLAN.dylib
          path: VCamLAN.dylib
          if-no-files-found: error
          retention-days: 30
